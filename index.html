<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Permutación de grupos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabecera -->
  <header class="cabecera">
    <div class="cabecera-interior">
      <div class="textos">
        <p class="sobretitulo">Cifrado clásico</p>
        <h1>Permutación de grupos</h1>
        <p class="bajada">Reordena las letras de cada grupo con una clave, y deshace el orden con su inversa.</p>
      </div>

      <!-- Adorno: las fichas de la presentación -->
      <div class="fichas" aria-hidden="true">
        <span class="ficha">␣</span><span class="ficha">a</span><span class="ficha">l</span><span class="ficha">o</span><span class="ficha">H</span>
        <span class="flecha-adorno">→</span>
        <span class="ficha clara">H</span><span class="ficha clara">o</span><span class="ficha clara">l</span><span class="ficha clara">a</span><span class="ficha clara">␣</span>
      </div>
    </div>
  </header>

  <main class="contenedor">

    <!-- Columna izquierda, lo que escribe el usuario -->
    <section class="panel entrada">

      <!-- Selector de modo -->
      <div class="fila-modo">
        <div class="selector" role="group" aria-label="Modo">
          <button type="button" class="opcion activa" data-modo="cifrar">Cifrar</button>
          <button type="button" class="opcion" data-modo="descifrar">Descifrar</button>
        </div>
      </div>

      <!-- Paso 1 -->
      <div class="paso">
        <span class="numero">1</span>
        <label for="mensaje" id="etiqueta-mensaje">Mensaje de entrada</label>
      </div>
      <textarea id="mensaje" rows="5" placeholder="Hola Mundo"></textarea>

      <label class="casilla">
        <input type="checkbox" id="espacios" checked>
        Los espacios son parte del mensaje
      </label>

      <!-- Paso 2 -->
      <div id="bloque-clave">
        <div class="paso">
          <span class="numero">2</span>
          <label for="clave">Clave <span class="ayuda">por ejemplo 3,1,2 o 3 1 2</span></label>
        </div>
        <input type="text" id="clave" placeholder="3,1,2" autocomplete="off">
      </div>

      <!-- Paso 3 -->
      <div class="paso">
        <span class="numero">3</span>
        <span class="titulo-paso">Procesa el mensaje</span>
      </div>
      <div class="botones">
        <button type="button" id="boton-procesar" class="principal">Procesar</button>
        <button type="button" id="boton-limpiar" class="secundario">Limpiar</button>
        <button type="button" id="boton-ejemplo" class="enlace">Cargar ejemplo</button>
      </div>

      <p id="error" class="error" role="alert" hidden></p>
    </section>

    <!-- Columna derecha, lo que devuelve la herramienta -->
    <section class="panel salida">

      <div id="zona-resultado" hidden>
        <div class="cabecera-resultado">
          <span class="rotulo">Resultado</span>
          <button type="button" id="boton-copiar" class="pequeno">Copiar</button>
        </div>
        <div id="resultado" class="resultado" aria-live="polite"></div>
        <p id="nota" class="nota" hidden></p>
      </div>

      <details id="zona-pasos" class="pasos" hidden open>
        <summary>
          <span id="titulo-pasos">Pasos del proceso</span>
        </summary>
        <div id="contenido-pasos"></div>
      </details>

      <!-- Se muestra solo mientras no haya resultado -->
      <div class="vacio">
        <div class="fichas-vacio" aria-hidden="true">
          <span class="ficha">?</span><span class="ficha">?</span><span class="ficha">?</span>
        </div>
        <p>Aquí aparecerá el resultado y el paso a paso de cada grupo.</p>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
